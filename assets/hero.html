<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ebcdicjp hero</title>
<!-- Source of assets/hero.png. Render: msedge --headless --screenshot=hero.png --window-size=1600,900 --force-device-scale-factor=2 hero.html -->
<style>
  :root {
    --bg: #0c1410;       /* terminal black, slightly green */
    --ink: #eef3ef;
    --dim: #7f948a;
    --green: #4fd68a;    /* phosphor green */
    --line: #1d2a23;
  }
  html, body { margin: 0; width: 1600px; height: 900px; background: var(--bg); overflow: hidden; }
  .card {
    position: absolute; inset: 0; background: var(--bg);
    /* faint scan lines */
    background-image: repeating-linear-gradient(0deg, transparent 0 5px, rgba(255,255,255,0.018) 5px 6px);
    font-family: "Noto Sans JP", "Yu Gothic", sans-serif;
  }
  .content { position: absolute; left: 150px; top: 205px; }
  .word { display: flex; align-items: center; font-family: "Cascadia Mono", Consolas, monospace; font-weight: 700; }
  .word .base { font-size: 176px; color: var(--ink); letter-spacing: -0.02em; line-height: 1; }
  .word .jp { font-size: 176px; color: var(--green); line-height: 1; margin: 0 6px; letter-spacing: -0.02em; }
  .shift {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 168px; width: 70px; margin: 0 6px; box-sizing: border-box;
    border: 4px solid var(--green); color: var(--green);
    font-size: 30px; font-weight: 700; letter-spacing: 0.02em;
  }
  .shift.so { border-right: none; border-radius: 14px 0 0 14px; margin-left: 22px; }
  .shift.si { border-left: none;  border-radius: 0 14px 14px 0; }
  .hex {
    margin-top: 40px; font-family: "Cascadia Mono", Consolas, monospace; font-size: 34px; color: var(--dim);
    letter-spacing: 0.02em;
  }
  .hex .k { color: var(--green); }
  .hex .arrow { color: var(--dim); margin: 0 18px; }
  .hex .out { color: var(--ink); font-family: "Noto Sans JP", sans-serif; font-weight: 700; }
  .tag { margin-top: 64px; font-size: 52px; white-space: nowrap; font-weight: 900; color: var(--ink); letter-spacing: 0.02em; }
  .sub { margin-top: 24px; font-size: 29px; font-weight: 500; color: var(--dim); letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="card">
    <div class="content">
      <div class="word">
        <span class="base">ebcdic</span><span class="shift so">0E</span><span class="jp">jp</span><span class="shift si">0F</span>
      </div>
      <div class="hex"><span class="k">0E</span> 45 65 45 63 <span class="k">0F</span><span class="arrow">→</span><span class="out">山田</span></div>
      <div class="tag">メインフレームの日本語を、手元とAIで読み書きする。</div>
      <div class="sub">IBM930 / IBM939・COBOLコピーブック・COMP-3　依存ゼロ・MCP対応</div>
    </div>
  </div>
</body>
</html>
